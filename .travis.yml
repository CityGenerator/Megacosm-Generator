language: python
dist: xenial
services:
  - "redis-server"
python:
  - "3.5"
  - "3.6"
  - "3.7"
  - "pypy3.5"
install:
  - pip install -r requirements.txt
  - pip install -r requirements-testing.txt
before_script:
  - cp config.py.example config.py
  - python reimport_data.py
script:
  - nosetests
after_success:
  - coveralls
